[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kachalka"
dynamic = ["version"]
description = "Простой клиент для скачивания видео через yt-dlp: окно, очередь, выбор качества и звуковой дорожки"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pywebview>=6.2"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.22"]

[project.scripts]
kachalka = "kachalka.app:main"

[project.urls]
Homepage = "https://github.com/vldvr/kachalka"
Issues = "https://github.com/vldvr/kachalka/issues"

[tool.setuptools]
packages = ["kachalka"]

[tool.setuptools.package-data]
kachalka = ["web/*", "web/vendor/phosphor/*"]

[tool.setuptools.dynamic]
version = { attr = "kachalka.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
