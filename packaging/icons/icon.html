<!doctype html>
<!-- Исходник иконки приложения: make_app.sh снимает его headless-хромом в PNG и собирает .icns. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .tile {
    position: absolute;
    left: 100px;
    top: 92px;
    width: 824px;
    height: 824px;
    border-radius: 186px;
    background: linear-gradient(180deg, #2a2e35 0%, #16181c 100%);
    box-shadow: 0 18px 40px rgb(0 0 0 / 0.32), inset 0 2px 0 rgb(255 255 255 / 0.08);
  }
  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 420px;
    height: 420px;
    margin: -210px 0 0 -210px;
    border-radius: 50%;
    border: 26px solid rgb(255 91 63 / 0.28);
    box-sizing: border-box;
  }
  .dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 300px;
    height: 300px;
    margin: -150px 0 0 -150px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #ff8a6f 0%, #ff5b3f 45%, #d93d24 100%);
    box-shadow: 0 10px 30px rgb(255 91 63 / 0.35);
  }
</style>
</head>
<body>
  <div class="tile"><div class="ring"></div><div class="dot"></div></div>
</body>
</html>
